services:
  sftp:
    image: atmoz/sftp:alpine
    container_name: integration-sftp
    platform: linux/amd64
    ports:
      - "${SFTP_PORT}:22"
    # user:password:UID:GID:directories-to-create. Empty UID/GID let the image choose.
    command: ${SFTP_USER}:${SFTP_PASSWORD}:::${SFTP_UPLOAD_DIR}
    volumes:
      # atmoz/sftp reads every *.pub here into the account's authorized_keys at startup. Password auth
      # stays enabled, so this adds a way in rather than replacing one — which is what lets the same
      # container serve the password tests and the key tests.
      - ./keys:/home/${SFTP_USER}/.ssh/keys:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -ltn | grep -q ':22 '"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s

  webdav:
    image: bytemark/webdav:2.4
    container_name: integration-webdav
    platform: linux/amd64
    ports:
      - "${WEBDAV_PORT}:80"
    environment:
      AUTH_TYPE: Basic
      USERNAME: ${WEBDAV_USER}
      PASSWORD: ${WEBDAV_PASSWORD}
    healthcheck:
      # An unauthenticated request answers 401, which is proof enough that Apache is listening and the
      # DAV module is loaded — a 200 would mean authentication was not configured.
      test: ["CMD", "sh", "-c", "wget -q -S -O /dev/null http://localhost/ 2>&1 | grep -q '401'"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s
