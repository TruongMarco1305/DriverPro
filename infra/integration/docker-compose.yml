services:
  sftp:
    # Profiles are what let `script.sh sftp` start one container instead of four. A service with no
    # profile always starts, so every service here has one.
    profiles: ["sftp"]
    image: atmoz/sftp:alpine
    container_name: integration-sftp
    platform: linux/amd64
    ports:
      - "${SFTP_PORT}:22"
    # user:password:UID:GID:directories-to-create. Empty UID/GID let the image choose.
    command: ${SFTP_USER}:${SFTP_PASSWORD}:::${SFTP_UPLOAD_DIR}
    volumes:
      # atmoz/sftp reads every *.pub here into the account's authorized_keys at startup. Password auth
      # stays enabled, so this adds a way in rather than replacing one — which is what lets the same
      # container serve the password tests and the key tests.
      - ./keys:/home/${SFTP_USER}/.ssh/keys:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -ltn | grep -q ':22 '"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s

  webdav:
    profiles: ["webdav"]
    image: bytemark/webdav:2.4
    container_name: integration-webdav
    platform: linux/amd64
    ports:
      - "${WEBDAV_PORT}:80"
    environment:
      AUTH_TYPE: Basic
      USERNAME: ${WEBDAV_USER}
      PASSWORD: ${WEBDAV_PASSWORD}
    healthcheck:
      # An unauthenticated request answers 401, which is proof enough that Apache is listening and the
      # DAV module is loaded — a 200 would mean authentication was not configured.
      test: ["CMD", "sh", "-c", "wget -q -S -O /dev/null http://localhost/ 2>&1 | grep -q '401'"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s

  # TLS in front of the WebDAV server, with a certificate Caddy signs itself. Untrusted by construction,
  # which is exactly the case slice 3c exists to handle: the servers WebDAV is actually run on — a
  # Nextcloud in a cupboard, a NAS — very often look like this.
  webdav-tls:
    profiles: ["webdav"]
    image: caddy:2-alpine
    container_name: integration-webdav-tls
    depends_on:
      webdav:
        condition: service_healthy
    ports:
      - "${WEBDAV_TLS_PORT}:443"
    command: >
      caddy reverse-proxy
        --from https://localhost:443
        --to http://webdav:80
        --internal-certs
    healthcheck:
      # `--no-check-certificate` deliberately: the certificate is *meant* to be untrusted, so verifying
      # it here would fail for the very reason this service exists. This checks only that TLS terminates
      # and proxies through.
      test: ["CMD", "sh", "-c", "wget -q --no-check-certificate -S -O /dev/null https://localhost/ 2>&1 | grep -q '401'"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  nextcloud:
    # Its own profile. It is WebDAV, but it takes forty seconds to install where the plain server takes
    # one, and that difference is the whole reason the features are split.
    profiles: ["nextcloud"]
    # Deliberately *not* pinned to an architecture: this image is published for arm64 too, and running
    # it emulated made the server so slow that ordinary requests timed out. See the note below.
    image: nextcloud:30-apache
    container_name: integration-nextcloud
    ports:
      - "${NEXTCLOUD_PORT}:80"
    environment:
      SQLITE_DATABASE: nextcloud          # no separate database container to wait on
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_PASSWORD}
      # Without this Nextcloud refuses requests whose Host header it does not recognise, which from a
      # test looks like a mysterious 400.
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
    healthcheck:
      # `status.php` answers only once installation has finished, which is what needs waiting for — the
      # port is listening long before the server is usable.
      test: ["CMD", "sh", "-c", "curl -sf http://localhost/status.php | grep -q '\"installed\":true'"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 30s

  # TLS in front of Nextcloud, for the manual pass rather than the tests. The tests set
  # `webdav.allowsInsecureHTTP` and use plain HTTP; the app has no UI for that property and always builds
  # an https:// URL, so without this there is no way to point DriverPro at the local Nextcloud by hand.
  # The certificate is self-signed, so the trust prompt is part of the walk — which is the right pairing.
  nextcloud-tls:
    profiles: ["nextcloud"]
    image: caddy:2-alpine
    container_name: integration-nextcloud-tls
    depends_on:
      nextcloud:
        condition: service_healthy
    ports:
      - "${NEXTCLOUD_TLS_PORT}:443"
    command: >
      caddy reverse-proxy
        --from https://localhost:443
        --to http://nextcloud:80
    healthcheck:
      # Nextcloud answers status.php without authentication, so this checks the whole path — TLS
      # terminates, the proxy reaches Nextcloud, and Nextcloud is installed.
      test: ["CMD", "sh", "-c", "wget -q --no-check-certificate -O - https://localhost/status.php 2>&1 | grep -q '\"installed\":true'"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  # MinIO (M4). The S3 server that runs on a laptop — same API, none of the account, the bill, or the
  # network. Published for arm64, so no `platform:` pin: see the architecture note in the README.
  minio:
    profiles: ["s3"]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: integration-minio
    ports:
      - "${S3_PORT}:9000"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    # The buckets are directories. MinIO adopts every top-level directory in its data dir as a bucket, so
    # creating them before the server starts saves a second container — and a second container is not
    # free here: `compose up --wait` treats *any* container that exits as a failed start, even one that
    # exited 0 having done its job. An `mc` sidecar therefore breaks the runner rather than seeding it.
    entrypoint: >
      sh -c "mkdir -p /data/${S3_BUCKET} /data/${S3_BUCKET}-second && exec minio server /data"
    healthcheck:
      # MinIO's own liveness endpoint. The buckets are already there by the time it answers, because
      # they were made before the server was exec'd.
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s

  # LocalStack (M4). The other S3 on a laptop, and worth having beside MinIO rather than instead of it:
  # two implementations disagree about more than one ever admits to, and M3 learned that lesson the hard
  # way when the contract passed against Apache and failed against Nextcloud.
  localstack:
    profiles: ["localstack"]
    # Published for arm64, so no `platform:` pin — see the architecture note in the README.
    image: localstack/localstack:4
    container_name: integration-localstack
    ports:
      - "${LOCALSTACK_PORT}:4566"
    environment:
      # Only S3. LocalStack emulates most of AWS, and starting the rest costs time for services no test
      # will ever call.
      SERVICES: s3
    healthcheck:
      # The port answers well before S3 is usable, so check the service's own status rather than the
      # socket — the same reason Nextcloud's healthcheck reads `status.php` instead of connecting.
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"s3\": *\"\\(available\\|running\\)\"'"]
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 5s